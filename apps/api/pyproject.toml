[project]
name = "animatter-api"
version = "0.1.0"
description = "Animatter Podcast Studio — local API for transcription, subtitle correction, waveform editing and document generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "numpy>=2.0",
    "pillow>=11",
    "psd-tools>=1.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
animatter = "animatter.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese UI copy legitimately uses full-width punctuation; RUF001/002/003 flag it.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires the call in the signature default.
"src/animatter/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["animatter"]

[[tool.mypy.overrides]]
module = ["animatter.core.*", "animatter.services.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real Aliyun endpoints (deselected by default)"]
# Parallel by default: 6:00 serial → 0:40 on 8 workers (measured). ``loadscope`` puts a whole
# module on one worker, which is what keeps module-scoped fixtures (the 6-second PSD compile,
# the imported template) shared instead of re-run per worker — with the default ``load``
# distribution one test in test_video_template_edits failed because a module fixture's state
# was split across processes.
addopts = "-m 'not live' -p xdist -n auto --dist loadscope"
# For one file while iterating, `-n0` is faster than spinning up workers::
#
#     pytest tests/test_decks.py -n0
